@if (open) {
  <div class="backdrop" (click)="onBackdrop($event)">
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="icon" [class.is-danger]="variant === 'danger'" aria-hidden="true">
        @if (variant === 'danger') {
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
        } @else {
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/></svg>
        }
      </div>

      <h2 id="confirm-title" class="title">{{ title }}</h2>
      @if (message) {
        <p class="message">{{ message }}</p>
      }
      <ng-content></ng-content>

      @if (note) {
        <p class="note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17h.01"/></svg>
          {{ note }}
        </p>
      }

      <div class="actions">
        <button type="button" class="btn" (click)="cancel()" [disabled]="loading">{{ cancelText }}</button>
        <button type="button" class="btn" [class.btn-confirm-danger]="variant === 'danger'"
                [class.btn-primary]="variant !== 'danger'" (click)="confirm()" [disabled]="loading">
          {{ loading ? 'Đang xử lý...' : confirmText }}
        </button>
      </div>
    </div>
  </div>
}
