<a class="ac" [routerLink]="['/news', article()._id]">
  <span class="ac-cover">
    <img [src]="cover()" [alt]="article().title" loading="lazy" (error)="onCoverError()" />
  </span>
  <span class="ac-meta">
    @if (category()) {
      <span class="ac-badge">{{ category() }}</span>
    }
    <span>{{ article().readMinutes }} phút đọc</span>
  </span>
  <span class="ac-title">{{ article().title }}</span>
  @if (article().desc) {
    <span class="ac-excerpt">{{ article().desc }}</span>
  }
  <span class="ac-byline">
    @if (article().author?.name; as name) {
      <strong>{{ name }}</strong>
      @if (date()) { · }
    }
    {{ date() }}
  </span>
</a>
