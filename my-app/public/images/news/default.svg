    <rect x="482" y="70" width="168" height="40" rx="20" fill="#FEF9C3" stroke="#1C1917" stroke-width="2"/>
    <text x="566" y="96" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">✦ LIGHTBOOK NEWS</text>
