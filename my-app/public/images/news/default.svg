<svg xmlns="http://www.w3.org/2000/svg" width="768" height="480" viewBox="0 0 768 480" fill="none">
  <!-- Ảnh minh họa mặc định cho Lightbook News (16:10) — nền pastel có lưới, khối phẳng, viền ink, sticker nghiêng -->
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse" x="24" y="24">
      <path d="M56 0H0V56" stroke="#FCDDEC" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="768" height="480" fill="#FDF2F8"/>
  <rect width="768" height="480" fill="url(#grid)"/>

  <!-- Tờ báo gấp đôi -->
  <g stroke="#1C1917" stroke-width="2" stroke-linejoin="round">
    <path d="M238 128H530V368H238Z" fill="#1C1917" transform="translate(0 6)"/>
    <path d="M238 128H530V368H238Z" fill="#FFFFFF"/>
    <path d="M384 128V368" />
    <rect x="262" y="154" width="98" height="64" rx="8" fill="#D8F0ED"/>
    <rect x="408" y="154" width="98" height="20" rx="4" fill="#1C1917"/>
  </g>
  <g stroke="#D6D3D1" stroke-width="6" stroke-linecap="round">
    <path d="M262 244H360M262 266H346M262 288H360M262 310H330M262 332H352"/>
    <path d="M408 200H506M408 222H492M408 244H506M408 266H480M408 288H506M408 310H470M408 332H498"/>
  </g>

  <!-- Khối trang trí -->
  <circle cx="132" cy="352" r="34" fill="#FDE047" stroke="#1C1917" stroke-width="2"/>
  <circle cx="648" cy="112" r="12" fill="#F9A8D4" stroke="#1C1917" stroke-width="2"/>
